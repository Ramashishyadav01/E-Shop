<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop | Modern Online Store</title>

    <!-- Preconnect & DNS prefetch to backend for early TLS & connection setup -->
    <link rel="preconnect" href="https://e-shop-4fgk.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://e-shop-4fgk.onrender.com" />

    <!-- Trigger early backend wake-up ping while frontend bundles download -->
    <script>
      (function() {
        try {
          fetch('https://e-shop-4fgk.onrender.com/api/ping', { method: 'GET', keepalive: true }).catch(function() {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </body>
</html>
